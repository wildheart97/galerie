# Régénère manifest.json à chaque fois que tu ajoutes / supprimes des images.
name: Mettre à jour la galerie

on:
  push:
    branches: [main]
    paths: ["images/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-manifest.mjs
      - name: Enregistrer le manifest
        run: |
          git config user.name "galerie-bot"
          git config user.email "galerie-bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "maj manifest"
          git push
